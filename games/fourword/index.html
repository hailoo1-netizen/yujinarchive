<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>사자성어 한판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&family=Noto+Serif+KR:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF2FA; --sheet:#FFFFFF; --grid:#94A9D4; --grid-soft:#D8E1F2;
  --ink:#1F2A44; --ink-soft:#57617A; --red:#D63B3B; --red-bg:#FCECEC;
  --tile:#FFF6D6; --tile-edge:#E2C766; --btn:#1F2A44; --btn-ink:#FFFFFF;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#12172A; --sheet:#1A2138; --grid:#4A5F96; --grid-soft:#222B47;
    --ink:#E8EEF7; --ink-soft:#A8B3C9; --red:#FF6E6E; --red-bg:#3A2326;
    --tile:#2E2A1A; --tile-edge:#8C7630; --btn:#E8EEF7; --btn-ink:#12172A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#12172A; --sheet:#1A2138; --grid:#4A5F96; --grid-soft:#222B47;
  --ink:#E8EEF7; --ink-soft:#A8B3C9; --red:#FF6E6E; --red-bg:#3A2326;
  --tile:#2E2A1A; --tile-edge:#8C7630; --btn:#E8EEF7; --btn-ink:#12172A;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; min-height:100vh; color:var(--ink);
  font-family:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  background-color:var(--paper);
  background-image:
    linear-gradient(var(--grid-soft) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-soft) 1px, transparent 1px);
  background-size:32px 32px;
  line-height:1.6;
}
main{max-width:760px; margin:0 auto; padding:24px 16px 48px}
.sheet{background:var(--sheet); border:2px solid var(--grid); border-radius:4px; padding:28px clamp(16px,4vw,40px)}
button{font:inherit; color:inherit; cursor:pointer}
button:focus-visible,.chip:focus-within{outline:3px solid var(--tile-edge); outline-offset:3px}
.hidden{display:none !important}
.hand{font-family:"Gaegu",cursive; font-weight:700}

/* cells */
.cells{display:flex; justify-content:center; position:relative; width:max-content; margin:0 auto}
.cell{
  width:clamp(60px,17vw,92px); height:clamp(60px,17vw,92px);
  border:2px solid var(--grid); margin-left:-2px; background:var(--sheet);
  display:grid; place-items:center; padding:0;
  font-family:"Gaegu",cursive; font-weight:700; font-size:clamp(38px,11vw,62px); line-height:1;
}
.cell:first-child{margin-left:0}
.cell.blank{background:var(--paper)}
.cell.wrong{color:var(--red); background:var(--red-bg)}
.cell.target{box-shadow:inset 0 -6px 0 var(--tile-edge)}
.title .cell span{opacity:0; transform:translateY(4px); animation:write .35s ease-out forwards}
@keyframes write{to{opacity:1; transform:none}}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}

.lead{text-align:center; color:var(--ink-soft); margin:16px 0 26px; font-size:1.05rem}
.group{margin:0 0 22px}
.group h2{font-size:1.05rem; margin:0 0 10px; font-weight:400; color:var(--ink-soft)}
.modes{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.mode{text-align:left; background:var(--sheet); border:2px solid var(--grid); border-radius:4px; padding:14px 16px}
.mode b{display:block; font-family:"Gaegu",cursive; font-size:1.7rem; line-height:1.1}
.mode small{color:var(--ink-soft); font-size:.92rem}
.mode[aria-pressed="true"]{border-color:var(--ink); box-shadow:4px 4px 0 var(--ink)}
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chip input{position:absolute; opacity:0; pointer-events:none}
.chip span{display:inline-block; padding:6px 14px; border:2px solid var(--grid); border-radius:999px; cursor:pointer; background:var(--sheet)}
.chip input:checked + span{background:var(--ink); color:var(--sheet); border-color:var(--ink)}
.primary{width:100%; padding:14px; border:none; border-radius:4px; background:var(--btn); color:var(--btn-ink); font-family:"Gaegu",cursive; font-weight:700; font-size:1.8rem}
.ghost{padding:12px 18px; border:2px solid var(--ink); border-radius:4px; background:transparent; font-family:"Gaegu",cursive; font-weight:700; font-size:1.4rem}
.best{text-align:center; color:var(--ink-soft); margin:14px 0 0; font-size:.95rem}

/* play */
.bar{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; gap:10px}
.bar .hand{font-size:1.5rem}
.bar .tries{color:var(--ink-soft)}
.meaning{
  font-family:"Gaegu",cursive; font-weight:700; text-align:center; word-break:keep-all;
  font-size:clamp(1.6rem,5vw,2.2rem); line-height:1.4; margin:4px 0 24px;
}
.board{position:relative; margin:0 auto 24px; width:max-content}
.mark{position:absolute; inset:-14px -20px; width:calc(100% + 40px); height:calc(100% + 28px); pointer-events:none; overflow:visible}
.mark path{fill:none; stroke:var(--red); stroke-width:4; stroke-linecap:round; stroke-dasharray:1; stroke-dashoffset:1; animation:draw .5s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.tiles{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; max-width:460px; margin:0 auto}
.tile{
  aspect-ratio:1; background:var(--tile); border:2px solid var(--tile-edge); border-radius:6px;
  box-shadow:0 4px 0 var(--tile-edge);
  font-family:"Gaegu",cursive; font-weight:700; font-size:clamp(30px,9vw,46px); line-height:1; position:relative;
}
.tile:active:not(:disabled){transform:translateY(3px); box-shadow:0 1px 0 var(--tile-edge)}
.tile:disabled{opacity:.25; cursor:default}
.tile .key{position:absolute; top:4px; left:7px; font-family:"Gowun Dodum",sans-serif; font-size:.8rem; font-weight:400; color:var(--ink-soft)}
.tools{display:flex; justify-content:center; gap:10px; margin-top:16px}
.tools button{padding:6px 14px; font-size:.95rem; border:2px solid var(--grid); background:var(--sheet); border-radius:999px}
.feedback{margin-top:22px; padding:16px 18px; border-left:5px solid var(--red); background:var(--red-bg); border-radius:0 4px 4px 0}
.feedback .verdict{font-family:"Gaegu",cursive; font-weight:700; font-size:1.7rem; line-height:1.2; margin:0 0 6px}
.hanja{font-family:"Noto Serif KR",serif; font-weight:600; font-size:1.5rem; letter-spacing:.15em; margin:0}
.feedback p{margin:0}
.example{margin-top:10px !important; padding-top:10px; border-top:2px dashed var(--grid); word-break:keep-all}
.example b{font-weight:400; color:var(--ink-soft); margin-right:6px}
.example em,.note .ex em{font-style:normal; color:var(--red); font-weight:700}
.note .ex{margin-top:4px; color:var(--ink); word-break:keep-all}
.next{margin-top:18px}
.hint{text-align:center; color:var(--ink-soft); font-size:.9rem; margin:14px 0 0}

/* result */
.stamp{width:150px; height:150px; margin:4px auto 10px; border:5px solid var(--red); border-radius:50%; display:grid; place-items:center; text-align:center; color:var(--red); font-family:"Gaegu",cursive; font-weight:700; font-size:1.9rem; line-height:1.05; transform:rotate(-10deg)}
.score{text-align:center; font-family:"Gaegu",cursive; font-weight:700; font-size:2.4rem; margin:0}
.result-msg{text-align:center; color:var(--ink-soft); margin:0 0 22px}
.notes h2{font-family:"Gaegu",cursive; font-size:1.8rem; margin:8px 0 10px}
.note{padding:12px 0; border-top:2px dashed var(--grid)}
.note .w{font-family:"Gaegu",cursive; font-weight:700; font-size:1.6rem; line-height:1.3}
.note .w small{font-family:"Noto Serif KR",serif; font-size:1rem; color:var(--ink-soft); margin-left:8px; letter-spacing:.1em}
.note p{margin:2px 0 0; color:var(--ink-soft); font-size:.95rem}
.actions{display:flex; gap:12px; margin-top:22px}
.actions > *{flex:1}
@media (max-width:520px){ .modes{grid-template-columns:1fr} .actions{flex-direction:column} }
@media (prefers-reduced-motion: reduce){
  .title .cell span{animation:none; opacity:1; transform:none}
  .mark path{animation:none; stroke-dashoffset:0}
  .shake{animation:none}
}
</style>
</head>
<body>
<main>
  <section id="start" class="sheet">
    <div class="cells title" id="title" aria-label="사자성어 한판"></div>
    <p class="lead">뜻을 읽고 네 글자를 맞혀 보세요.</p>

    <div class="group">
      <h2>놀이 방법</h2>
      <div class="modes">
        <button class="mode" data-mode="build" aria-pressed="true"><b>네 글자 완성</b><small>글자 카드 8장 중 4장을 골라 순서대로 채워요</small></button>
        <button class="mode" data-mode="blank" aria-pressed="false"><b>한 글자 채우기</b><small>빈칸 하나에 들어갈 글자를 4개 중에 골라요</small></button>
      </div>
    </div>

    <div class="group">
      <h2>문제 수</h2>
      <div class="chips" role="radiogroup">
        <label class="chip"><input type="radio" name="count" value="10" checked><span>10문제</span></label>
        <label class="chip"><input type="radio" name="count" value="20"><span>20문제</span></label>
        <label class="chip"><input type="radio" name="count" value="0"><span>모든 문제</span></label>
      </div>
    </div>

    <button class="primary" id="startBtn">시작하기</button>
    <p class="best" id="best"></p>
  </section>

  <section id="play" class="sheet hidden" aria-live="polite">
    <div class="bar">
      <span class="hand" id="progress"></span>
      <span class="tries" id="tries"></span>
    </div>
    <p class="meaning" id="meaning"></p>
    <div class="board" id="board"><div class="cells" id="cells"></div></div>
    <div class="tiles" id="tiles"></div>
    <div class="tools" id="tools">
      <button id="undoBtn">한 글자 지우기</button>
      <button id="clearBtn">모두 지우기</button>
    </div>
    <div class="feedback hidden" id="feedback">
      <p class="verdict" id="verdict"></p>
      <p class="hanja" id="hanja"></p>
      <p id="literal"></p>
      <p class="example" id="example"></p>
    </div>
    <button class="primary next hidden" id="nextBtn">다음 문제</button>
    <p class="hint" id="hint"></p>
  </section>

  <section id="result" class="sheet hidden">
    <div class="stamp" id="stamp"></div>
    <p class="score" id="score"></p>
    <p class="result-msg" id="resultMsg"></p>
    <div class="notes" id="notes"></div>
    <div class="actions">
      <button class="primary" id="againBtn">한 번 더</button>
      <button class="ghost" id="homeBtn">처음으로</button>
    </div>
  </section>
</main>

<script>
// [사자성어, 한자, 글자 그대로의 풀이, 뜻]
const IDIOMS = [
  ["일석이조","一石二鳥","돌 하나로 새 두 마리를 잡는다.","한 가지 일을 해서 두 가지 이익을 얻음"],
  ["동문서답","東問西答","동쪽을 묻는데 서쪽을 답한다.","묻는 말에 전혀 엉뚱한 대답을 함"],
  ["유비무환","有備無患","준비가 있으면 근심이 없다.","미리 준비해 두면 걱정할 일이 없음"],
  ["작심삼일","作心三日","마음먹은 것이 사흘을 간다.","굳게 마음먹은 결심이 오래가지 못함"],
  ["우왕좌왕","右往左往","오른쪽으로 갔다 왼쪽으로 갔다 한다.","이리저리 왔다 갔다 하며 갈피를 잡지 못함"],
  ["십중팔구","十中八九","열 가운데 여덟이나 아홉이다.","거의 대부분이거나 거의 틀림없음"],
  ["이심전심","以心傳心","마음으로 마음을 전한다.","말하지 않아도 마음과 마음으로 뜻이 통함"],
  ["막상막하","莫上莫下","위도 아니고 아래도 아니다.","누가 더 낫고 못한지 가리기 어려움"],
  ["금상첨화","錦上添花","비단 위에 꽃을 더한다.","좋은 일에 또 좋은 일이 더해짐"],
  ["설상가상","雪上加霜","눈 위에 서리가 더해진다.","어려운 일이 엎친 데 덮친 격으로 겹침"],
  ["대기만성","大器晩成","큰 그릇은 늦게 만들어진다.","크게 될 사람은 늦게 이루어짐"],
  ["과유불급","過猶不及","지나침은 미치지 못함과 같다.","정도가 지나치면 모자란 것과 다름없음"],
  ["다다익선","多多益善","많으면 많을수록 더 좋다.","많을수록 더욱 좋음"],
  ["반신반의","半信半疑","반은 믿고 반은 의심한다.","어느 정도 믿으면서도 한편으로 의심함"],
  ["자업자득","自業自得","스스로 한 일을 스스로 얻는다.","자기가 저지른 일의 결과를 자기가 받음"],
  ["각양각색","各樣各色","각각의 모양과 각각의 빛깔이다.","저마다 다른 여러 가지 모양과 빛깔"],
  ["박학다식","博學多識","널리 배우고 많이 안다.","배운 것이 많고 아는 것이 많음"],
  ["어부지리","漁夫之利","어부의 이익이다.","둘이 다투는 사이에 엉뚱한 사람이 이익을 얻음"],
  ["고진감래","苦盡甘來","쓴 것이 다하면 단 것이 온다.","고생 끝에 즐거움이 옴"],
  ["동고동락","同苦同樂","괴로움을 함께하고 즐거움을 함께한다.","괴로움과 즐거움을 함께함"],
  ["청출어람","靑出於藍","푸른색은 쪽에서 나왔지만 쪽보다 더 푸르다.","제자가 스승보다 더 뛰어남"],
  ["자화자찬","自畫自讚","자기가 그린 그림을 스스로 칭찬한다.","자기가 한 일을 스스로 자랑함"],
  ["죽마고우","竹馬故友","대나무 말을 타고 놀던 옛 친구다.","어릴 때부터 함께 놀며 자란 친구"],
  ["우이독경","牛耳讀經","소 귀에 경을 읽는다.","아무리 가르치고 일러 주어도 알아듣지 못함"],
  ["마이동풍","馬耳東風","말 귀에 동쪽 바람이 스친다.","남의 말을 귀담아듣지 않고 흘려버림"],
  ["사필귀정","事必歸正","모든 일은 반드시 바른 데로 돌아간다.","무슨 일이든 결국 옳은 쪽으로 돌아감"],

  ["온고지신","溫故知新","옛것을 익혀 새것을 안다.","옛것을 배워 새로운 것을 깨달음"],
  ["전화위복","轉禍爲福","재앙이 바뀌어 복이 된다.","나쁜 일이 오히려 좋은 일의 계기가 됨"],
  ["형설지공","螢雪之功","반딧불과 눈빛으로 이룬 공이다.","어려운 형편에서도 부지런히 공부해 이룬 보람"],

  ["천고마비","天高馬肥","하늘은 높고 말은 살찐다.","하늘이 맑고 먹을 것이 풍성한 가을"],

  ["공명정대","公明正大","공정하고 밝으며 바르고 크다.","사사로움 없이 떳떳하고 바름"],
  ["일취월장","日就月將","날마다 나아가고 달마다 자란다.","실력이 나날이 빠르게 늘어감"],
  ["함흥차사","咸興差使","함흥으로 보낸 심부름꾼이다.","심부름 간 사람이 소식이 없거나 아주 늦게 옴"],
  ["조삼모사","朝三暮四","아침에 셋, 저녁에 넷이다.","눈앞의 차이만 보고 결과가 같은 것을 모름"],
  ["우공이산","愚公移山","우공이 산을 옮긴다.","꾸준히 노력하면 아무리 큰일도 이룰 수 있음"],
  ["새옹지마","塞翁之馬","변방 노인의 말이다.","좋은 일과 나쁜 일은 미리 알 수 없음"],
  ["표리부동","表裏不同","겉과 속이 같지 않다.","겉으로 드러나는 것과 속마음이 다름"],
  ["언행일치","言行一致","말과 행동이 하나로 맞는다.","말한 대로 행동함"],
  ["정정당당","正正堂堂","바르고 바르며 당당하고 당당하다.","태도나 방법이 바르고 떳떳함"],
  ["감언이설","甘言利說","달콤한 말과 이로운 말이다.","남을 꾀려고 듣기 좋게 하는 말"],
  ["칠전팔기","七顚八起","일곱 번 넘어지고 여덟 번 일어난다.","여러 번 실패해도 굽히지 않고 다시 일어남"],
  ["오리무중","五里霧中","오 리나 되는 짙은 안개 속이다.","일이 어떻게 되어 가는지 전혀 알 수 없음"],
  ["아전인수","我田引水","내 논에 물을 끌어온다.","자기에게만 이롭게 생각하거나 행동함"],
  ["금시초문","今始初聞","이제 막 처음 듣는다.","지금 처음으로 들음"],

  "선견지명":"소풍날 비가 올 줄 알고 우비를 챙긴 짝꿍의 선견지명에 놀랐다.",
  "소탐대실":"사탕 하나 더 먹으려다 친구와 사이가 나빠지면 소탐대실이야.",
  "어불성설":"청소는 하나도 안 하고 칭찬만 받겠다는 건 어불성설이다.",
  "유유상종":"책 좋아하는 아이들이 도서관에 모이는 걸 보니 유유상종이다.",
  "인과응보":"욕심쟁이 놀부가 벌을 받은 것은 인과응보다.",
  "임기응변":"발표 중에 화면이 꺼졌지만 임기응변으로 말로 설명했다.",
  "자포자기":"한 번 실패했다고 자포자기하지 말고 다시 해 보자.",
  "적반하장":"내 발을 밟은 동생이 오히려 화를 내다니 적반하장이다.",
  "조족지혈":"내 용돈은 형 용돈에 비하면 조족지혈이다.",
  "주경야독":"할아버지는 젊으실 때 주경야독으로 공부해 선생님이 되셨다.",
  "진퇴양난":"앞에는 큰 개가, 뒤에는 공사장이 있어 진퇴양난이었다.",
  "타산지석":"친구의 실수를 타산지석으로 삼아 나는 더 조심했다.",
  "팔방미인":"공부도 운동도 노래도 잘하는 반장은 팔방미인이다.",
  "풍전등화":"임진왜란 때 나라의 운명은 풍전등화와 같았다.",
  "화룡점정":"케이크 위에 딸기를 올려 화룡점정을 찍었다.",
  "횡설수설":"너무 떨려서 발표할 때 횡설수설하고 말았다.",
  "등하불명":"온 집을 뒤진 안경이 머리 위에 있었으니 등하불명이다.",
  "묵묵부답":"누가 꽃병을 깨뜨렸느냐고 물었지만 모두 묵묵부답이었다.",
  "박장대소":"짝꿍의 재미있는 흉내에 반 전체가 박장대소했다.",
  "백년대계":"교육은 나라의 백년대계라고 한다.",
  "부전자전":"아빠처럼 축구를 좋아하는 동생을 보니 부전자전이다.",
  "비일비재":"동생이 내 물건을 몰래 쓰는 일은 비일비재하다.",
  "사상누각":"기초 공부 없이 어려운 문제만 푸는 것은 사상누각이다.",
  "산전수전":"산전수전 다 겪으신 할아버지의 이야기는 언제나 재미있다.",
  "십시일반":"반 친구들이 십시일반으로 모은 용돈으로 이웃을 도왔다.",
  "약육강식":"초원의 동물들은 약육강식의 세계에서 살아간다.",
  "우유부단":"메뉴 하나 고르는 데 30분이나 걸리다니 너무 우유부단하다.",
  "위기일발":"공이 얼굴로 날아왔지만 위기일발의 순간에 피했다.",
  "유언비어":"인터넷에 퍼진 유언비어를 그대로 믿으면 안 된다.",
  "일희일비":"시험 점수 하나에 일희일비하지 말고 꾸준히 공부하자.",
  "좌충우돌":"처음 해 보는 요리라 좌충우돌했지만 결국 맛있게 완성했다."
};

function fillExample(el, q){
  el.textContent = "";
  const s = EXAMPLES[q[0]]; if(!s) return;
  const parts = s.split(q[0]);
  parts.forEach((part, i) => {
    if(i){ const em = document.createElement("em"); em.textContent = q[0]; el.appendChild(em); }
    el.append(part);
  });
}

const $ = id => document.getElementById(id);
const ALL_SYL = [...new Set(IDIOMS.flatMap(q => [...q[0]]))];
let mode = "build", queue = [], idx = 0, correct = 0, wrongs = [];
let state = null; // per-question

const store = {
  get(k){ try{ return Number(localStorage.getItem(k)) || 0; }catch(e){ return 0; } },
  set(k,v){ try{ localStorage.setItem(k,String(v)); }catch(e){} }
};
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const decoys = (exclude, n) => shuffle(ALL_SYL.filter(s => !exclude.includes(s))).slice(0, n);
const show = id => { ["start","play","result"].forEach(s => $(s).classList.toggle("hidden", s !== id)); window.scrollTo(0,0); };

// title
(function(){
  let n = 0;
  for(const ch of "사자성어한판"){
    const c = document.createElement("div"); c.className = "cell";
    const s = document.createElement("span"); s.textContent = ch; s.style.animationDelay = (n++*0.12)+"s";
    c.appendChild(s); $("title").appendChild(c);
  }
})();

function showBest(){
  const parts = [];
  const b = store.get("idiom-best-build"), k = store.get("idiom-best-blank");
  if(b) parts.push(`네 글자 완성 최고 ${b}%`);
  if(k) parts.push(`한 글자 채우기 최고 ${k}%`);
  $("best").textContent = parts.length ? "내 기록: " + parts.join(", ") : "";
}
showBest();

document.querySelectorAll(".mode").forEach(b => b.addEventListener("click", () => {
  mode = b.dataset.mode;
  document.querySelectorAll(".mode").forEach(x => x.setAttribute("aria-pressed", x === b));
}));

function startGame(){
  const n = Number(document.querySelector('input[name="count"]:checked').value);
  queue = shuffle(IDIOMS); if(n) queue = queue.slice(0, n);
  idx = 0; correct = 0; wrongs = [];
  show("play"); renderQuestion();
}

function renderQuestion(){
  const q = queue[idx];
  const word = [...q[0]];
  $("progress").textContent = `${idx+1} / ${queue.length}`;
  $("meaning").textContent = q[3];
  $("feedback").classList.add("hidden");
  $("nextBtn").classList.add("hidden");
  const old = $("board").querySelector(".mark"); if(old) old.remove();

  if(mode === "build"){
    const tiles = shuffle([...word, ...decoys(word, 4)]);
    state = { q, word, tiles, filled:[null,null,null,null], used:new Set(), tries:0, done:false };
    $("tools").classList.remove("hidden");
    $("hint").textContent = "카드를 누르면 앞 칸부터 채워져요. 기회는 두 번이에요.";
  } else {
    const pos = Math.floor(Math.random()*4);
    const tiles = shuffle([word[pos], ...decoys(word, 3)]);
    state = { q, word, tiles, pos, done:false, tries:0 };
    $("tools").classList.add("hidden");
    $("hint").textContent = "키보드: 1~4 로 고르고, Enter 로 넘어가요";
  }
  $("tries").textContent = mode === "build" ? "기회 2번" : "";
  drawCells(); drawTiles();
}

function drawCells(wrongIdx = []){
  const box = $("cells"); box.textContent = "";
  state.word.forEach((ch, i) => {
    const c = document.createElement(mode === "build" ? "button" : "div");
    c.className = "cell";
    if(mode === "build"){
      const t = state.filled[i];
      if(t === null){ c.classList.add("blank"); c.setAttribute("aria-label", `${i+1}번째 칸 비어 있음`); }
      else { c.textContent = state.tiles[t]; c.setAttribute("aria-label", `${i+1}번째 칸 ${state.tiles[t]}, 눌러서 지우기`); }
      if(state.filled.indexOf(null) === i && !state.done) c.classList.add("target");
      if(wrongIdx.includes(i)) c.classList.add("wrong");
      c.disabled = state.done;
      c.addEventListener("click", () => { if(state.filled[i] !== null && !state.done){ state.used.delete(state.filled[i]); state.filled[i] = null; drawCells(); drawTiles(); } });
    } else {
      if(i === state.pos){
        if(state.done){ c.textContent = ch; c.style.color = "var(--red)"; }
        else { c.classList.add("blank","target"); c.textContent = "?"; c.style.color = "var(--ink-soft)"; }
      } else c.textContent = ch;
    }
    box.appendChild(c);
  });
}

function drawTiles(){
  const box = $("tiles"); box.textContent = "";
  box.style.gridTemplateColumns = "repeat(4,1fr)";
  state.tiles.forEach((s, i) => {
    const b = document.createElement("button"); b.className = "tile";
    if(mode === "blank"){ const k = document.createElement("span"); k.className = "key"; k.textContent = i+1; b.appendChild(k); }
    b.append(s);
    b.disabled = state.done || (mode === "build" && state.used.has(i));
    b.addEventListener("click", () => mode === "build" ? placeTile(i) : pickBlank(i));
    box.appendChild(b);
  });
}

function placeTile(i){
  if(state.done || state.used.has(i)) return;
  const slot = state.filled.indexOf(null); if(slot < 0) return;
  state.filled[slot] = i; state.used.add(i);
  drawCells(); drawTiles();
  if(!state.filled.includes(null)) checkBuild();
}

function checkBuild(){
  state.tries++;
  const wrongIdx = state.filled.map((t,i) => state.tiles[t] === state.word[i] ? -1 : i).filter(i => i >= 0);
  if(!wrongIdx.length) return finishQuestion(true);
  if(state.tries < 2){
    drawCells(wrongIdx);
    $("cells").classList.remove("shake"); void $("cells").offsetWidth; $("cells").classList.add("shake");
    $("tries").textContent = "기회 1번 남음";
    $("hint").textContent = "빨간 칸이 틀렸어요. 맞은 글자는 그대로 둘게요.";
    setTimeout(() => {
      wrongIdx.forEach(i => { state.used.delete(state.filled[i]); state.filled[i] = null; });
      drawCells(); drawTiles();
    }, 700);
  } else {
    state.filled = state.word.map(ch => { const t = state.tiles.findIndex((s,k) => s === ch && !state._taken?.has(k)); (state._taken ??= new Set()).add(t); return t; });
    finishQuestion(false);
  }
}

function pickBlank(i){
  if(state.done) return;
  const ok = state.tiles[i] === state.word[state.pos];
  state.picked = state.tiles[i];
  finishQuestion(ok);
}

function drawCircle(){
  const ns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(ns,"svg");
  svg.setAttribute("class","mark"); svg.setAttribute("viewBox","0 0 400 100");
  svg.setAttribute("preserveAspectRatio","none"); svg.setAttribute("aria-hidden","true");
  const p = document.createElementNS(ns,"path"); p.setAttribute("pathLength","1");
  p.setAttribute("d","M210,6 C320,4 394,24 392,50 C390,80 300,96 196,94 C90,92 8,78 8,50 C8,22 96,6 236,10");
  svg.appendChild(p); $("board").appendChild(svg);
}

function finishQuestion(ok){
  state.done = true;
  const q = state.q;
  if(ok) correct++; else wrongs.push(q);
  drawCells(); drawTiles();
  if(ok) drawCircle();
  $("tries").textContent = "";
  $("verdict").textContent = ok
    ? (mode === "build" && state.tries === 2 ? "두 번 만에 성공!" : ["정답이에요!","딱 맞았어요!","훌륭해요!"][Math.floor(Math.random()*3)])
    : `정답은 ‘${q[0]}’예요`;
  $("hanja").textContent = q[1];
  $("literal").textContent = `글자 그대로 풀면 ‘${q[2]}’라는 뜻이에요.`;
  const ex = $("example"); fillExample(ex, q);
  const label = document.createElement("b"); label.textContent = "예문"; ex.prepend(label);
  $("feedback").classList.remove("hidden");
  $("hint").textContent = "";
  $("nextBtn").textContent = idx >= queue.length - 1 ? "결과 보기" : "다음 문제";
  $("nextBtn").classList.remove("hidden");
  $("nextBtn").focus({preventScroll:true});
}

function next(){
  if(idx >= queue.length - 1) return finish();
  idx++; renderQuestion();
}

function finish(){
  const pct = Math.round(correct / queue.length * 100);
  const key = "idiom-best-" + mode;
  const isBest = pct > store.get(key); if(isBest) store.set(key, pct);
  const st = $("stamp"); st.textContent = "";
  (pct === 100 ? ["참","잘했어요"] : pct >= 70 ? ["잘","했어요"] : ["다시","해 봐요"])
    .forEach((t,i) => { if(i) st.appendChild(document.createElement("br")); st.append(t); });
  $("score").textContent = `${correct} / ${queue.length}`;
  $("resultMsg").textContent = (isBest && correct > 0 ? "새 기록이에요! " : "") +
    (wrongs.length ? "놓친 사자성어를 아래에서 다시 익혀 봐요." : "모든 사자성어를 맞혔어요.");
  const notes = $("notes"); notes.textContent = "";
  if(wrongs.length){
    const h = document.createElement("h2"); h.textContent = "다시 볼 사자성어"; notes.appendChild(h);
    wrongs.forEach(q => {
      const d = document.createElement("div"); d.className = "note";
      const w = document.createElement("div"); w.className = "w"; w.textContent = q[0];
      const s = document.createElement("small"); s.textContent = q[1]; w.appendChild(s);
      const p = document.createElement("p"); p.textContent = q[3];
      const ex = document.createElement("p"); ex.className = "ex"; fillExample(ex, q);
      d.append(w, p, ex); notes.appendChild(d);
    });
  }
  showBest(); show("result");
}

$("startBtn").addEventListener("click", startGame);
$("nextBtn").addEventListener("click", next);
$("againBtn").addEventListener("click", startGame);
$("homeBtn").addEventListener("click", () => show("start"));
$("undoBtn").addEventListener("click", () => {
  if(state.done) return;
  for(let i=3;i>=0;i--) if(state.filled[i] !== null){ state.used.delete(state.filled[i]); state.filled[i] = null; break; }
  drawCells(); drawTiles();
});
$("clearBtn").addEventListener("click", () => {
  if(state.done) return;
  state.filled = [null,null,null,null]; state.used.clear(); drawCells(); drawTiles();
});

document.addEventListener("keydown", e => {
  if($("play").classList.contains("hidden")) return;
  if(state.done){ if(e.key === "Enter" && document.activeElement !== $("nextBtn")) next(); return; }
  if(mode === "blank" && ["1","2","3","4"].includes(e.key)) pickBlank(Number(e.key)-1);
  if(mode === "build" && e.key === "Backspace"){ e.preventDefault(); $("undoBtn").click(); }
});
</script>
</body>
</html>
